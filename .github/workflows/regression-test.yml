name: Regression Test

on:
  push:

concurrency:
  group: regression-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y sysstat ccache clang-format

      - name: Start monitoring
        run: |
          mkdir -p tmp
          iostat -dx 1 >tmp/iostat.log &
          echo $! >tmp/iostat_pid.txt
          vmstat 1 >tmp/vmstat.log &
          echo $! >tmp/vmstat_pid.txt

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: 'cgen/go.sum' 

      - name: Install Go tool
        run: go install golang.org/x/tools/gopls@latest

      - name: Install Go packages
        run: go mod tidy
        working-directory: ./cgen

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust nightly toolchain with miri
        run: rustup toolchain install nightly --component miri

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache result of ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Limit ccache size
        run: ccache -M 1G

      - name: Check formatting
        run: bash check_formatting.sh

      - name: Check regression
        run: timeout 30m bash check_regression.sh

      - name: Check reproducibility
        run: timeout 30m bash check_reproducibility.sh

      - name: Run xtests with debug runtime
        run: timeout 30m bash run_xtests.sh --debug-runtime

      - name: Run xtests with debug user program
        run: timeout 30m bash run_xtests.sh --debug-user

      - name: Check equivalence with Go standard compiler tests
        run: timeout 30m bash check_go_compiler_tests.sh

      - name: Stop monitoring
        run: |
          kill $(cat tmp/iostat_pid.txt) || true
          kill $(cat tmp/vmstat_pid.txt) || true

      - name: Metrics of ccache
        run: ccache -s >tmp/ccache.log

      - name: Upload logs
        uses: actions/upload-artifact@v6
        with:
          name: metrics
          path: tmp/**/*.log
          retention-days: 7

      - name: Upload temporary files
        uses: actions/upload-artifact@v6
        with:
          name: temporary-files
          path: |
            tmp/**/*.c
            tmp/**/*.txt
          retention-days: 7
